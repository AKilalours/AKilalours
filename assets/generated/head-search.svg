<svg xmlns="http://www.w3.org/2000/svg" width="860" height="54" viewBox="0 0 860 54" role="img" aria-label="Search, ranking &amp; recommendation">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .h{font-size:19px;font-weight:700;fill:#3fb950} .s{font-size:12.5px;fill:#8b949e}
.n{font-size:12px;font-weight:700;fill:#3fb950}
.line{animation:draw 1.4s cubic-bezier(.2,.7,.2,1) both}
.run{animation:run 4.5s linear infinite}
.in{animation:in .6s both}
@keyframes draw{from{stroke-dashoffset:860}to{stroke-dashoffset:0}}
@keyframes run{from{transform:translateX(-80px)}to{transform:translateX(880px)}}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="in"><rect x="2" y="9" width="14" height="14" rx="4" fill="#3fb950"/>
<text x="26" y="22" class="h">Search, ranking &amp; recommendation</text>
<text x="26" y="41" class="s">Hybrid retrieval, learning-to-rank, ANN indexes, visual search.</text></g>
<rect x="801" y="8" width="57" height="20" rx="10" fill="#3fb950" fill-opacity=".14"/>
<text x="829" y="22" text-anchor="middle" class="n">2 repos</text>
<line class="line" x1="0" y1="52" x2="860" y2="52" stroke="#3fb950" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="860"/>
<rect class="run" x="0" y="51" width="70" height="3" rx="1.5" fill="#3fb950"/>
</svg>
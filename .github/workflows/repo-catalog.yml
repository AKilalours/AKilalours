# Keeps the "Every repository, by area" section, the project reel and the 3D graph
# in step with the account. Create a repo anywhere under the account and within six
# hours it has a card in the right section, or in "Just shipped" with a NEW badge if
# nothing identifies its area yet.
#
# Why a schedule and not an event: GitHub sends no event to this repository when a
# different repository is created, so nothing here can react instantly. Run it by
# hand from the Actions tab when you want a new repo to appear right away.
#
# GITHUB_TOKEN is enough here: listing public repos and reading their READMEs needs
# no extra scope, unlike the contribution stats.

name: Repository catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/catalog.json
      - .github/scripts/build_catalog.py
      - .github/scripts/test_build_catalog.py
      - .github/workflows/repo-catalog.yml

permissions:
  contents: write

concurrency:
  group: repo-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests first: a generator bug must not reach the live profile.
      - name: Test the generator
        run: python .github/scripts/test_build_catalog.py

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_catalog.py

      - name: Commit if anything changed
        run: |
          # The timestamp line and cache-busting query change on every run, so
          # compare with them stripped. Otherwise this commits every six hours.
          strip() { sed -E 's/\?v=[0-9]+//g; /generated by .*build_catalog/d; s/updated [A-Z][a-z]{2} [0-9]{2}, [0-9]{4}//; s/"generated": "[^"]*"//'; }
          changed=0
          for f in README.md docs/index.html docs/catalog.json $(git ls-files -mo --exclude-standard assets/generated); do
            if ! git cat-file -e HEAD:"$f" 2>/dev/null; then changed=1; break; fi
            if ! diff -q <(git show HEAD:"$f" | strip) <(strip < "$f") >/dev/null; then changed=1; break; fi
          done
          if [ -n "$(git ls-files -d assets/generated)" ]; then changed=1; fi
          if [ "$changed" = 0 ]; then echo "No catalog change."; exit 0; fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/index.html docs/catalog.json assets/generated
          git commit -m "catalog: refresh repository cards"
          # Other workflows also push to main; rebase and retry instead of failing.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

name: 3D contribution calendar
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-3d
  cancel-in-progress: false
jobs:
  build:
    name: Generate 3D contribution SVGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # The default GITHUB_TOKEN only sees PUBLIC contributions, which is why the
          # calendar undercounts against the number on the profile page. A classic PAT
          # with the read:user scope, stored as the GH_PAT secret, makes private
          # contributions count too. Only aggregate totals are exposed: no repo names,
          # no code. Falls back to the default token if the secret is absent.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No change in generated SVGs; nothing to commit."
          else
            git commit -m "chore: refresh 3D contribution calendar"
            git push
          fi
